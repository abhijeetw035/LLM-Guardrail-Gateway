version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mockllm:
    build:
      context: .
      dockerfile: Dockerfile.mockllm
    ports:
      - "9090:9090"
    environment:
      MOCK_LLM_LISTEN_ADDR: ":9090"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      MOCK_LLM_ADDR: "http://mockllm:9090"
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_PER_MINUTE: "60"
      DAILY_TOKEN_QUOTA: "100000"
      GATEWAY_POLICY_FILE: "configs/dev.policy"
      # --- LLM Provider (default: mock) ---
      # To use a real LLM, set LLM_PROVIDER and LLM_API_KEY below.
      # The mockllm service can be removed from depends_on when using a real provider.
      #
      # Groq (free tier, fast):
      # LLM_PROVIDER: "groq"
      # LLM_API_KEY: "gsk_your_groq_key_here"
      # LLM_MODEL: "llama-3.3-70b-versatile"   # optional, this is the default
      #
      # Google Gemini:
      # LLM_PROVIDER: "gemini"
      # LLM_API_KEY: "your_google_ai_api_key"
      # LLM_MODEL: "gemini-2.0-flash"           # optional, this is the default
      #
      # OpenAI:
      # LLM_PROVIDER: "openai"
      # LLM_API_KEY: "sk-your_openai_key"
      # LLM_MODEL: "gpt-4o-mini"                # optional, this is the default
    depends_on:
      redis:
        condition: service_healthy
      mockllm:
        condition: service_started
    volumes:
      - ./configs:/app/configs


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
