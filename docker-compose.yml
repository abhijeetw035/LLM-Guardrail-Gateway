version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mockllm:
    build:
      context: .
      dockerfile: Dockerfile.mockllm
    ports:
      - "9090:9090"
    environment:
      MOCK_LLM_LISTEN_ADDR: ":9090"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      MOCK_LLM_ADDR: "http://mockllm:9090"
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_PER_MINUTE: "60"
      DAILY_TOKEN_QUOTA: "100000"
      GATEWAY_POLICY_FILE: "configs/dev.policy"
    depends_on:
      redis:
        condition: service_healthy
      mockllm:
        condition: service_started
    volumes:
      - ./configs:/app/configs
